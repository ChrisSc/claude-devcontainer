# docker compose for the Claude Code sandbox.
#   project (container group): claude
#   service / container name : claude-code
#
# Standalone:  docker compose -f .devcontainer/compose.yaml up -d
#              docker exec -it claude-code zsh -l
# VS Code:     "Reopen in Container" (devcontainer.json references this file).
name: claude

services:
  claude-code:
    container_name: claude-code
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-America/New_York}
    # Required for the iptables/ipset egress firewall (init-firewall.sh). Only
    # NET_ADMIN is load-bearing; the firewall path uses no raw/packet sockets
    # (no -p icmp, no ping/traceroute), so NET_RAW is intentionally withheld.
    # Re-add NET_RAW deliberately (with a comment) only if raw ICMP is needed.
    cap_add:
      - NET_ADMIN
    # Disable IPv6 in the container so there is a single enforced network stack.
    # The egress firewall's strict default-deny is built on the IPv4 allowlist;
    # on an IPv6-enabled Docker host, AAAA destinations would otherwise bypass it
    # entirely. init-firewall.sh ALSO fails the v6 stack closed (ip6tables DROP)
    # as a backstop, but turning v6 off here removes the dual-stack surface
    # outright. Harmless if the host has no IPv6. (NET_ADMIN above lets the
    # container set these; on a kernel that rejects them, compose warns and the
    # ip6tables fail-closed in init-firewall.sh still covers v6.)
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    user: claude
    init: true                       # docker-init as PID1: reaps zombies, forwards signals
    working_dir: /workspace
    # DB secrets (PG* + DATABASE_URL) injected from the generated .env. Optional
    # so `docker compose` still works before `make env` has created it.
    env_file:
      - path: .env
        required: false
    environment:
      # Firewall posture: strict (default) | permissive | dev
      FIREWALL_MODE: ${FIREWALL_MODE:-strict}
      TZ: ${TZ:-America/New_York}
      # Agent Toolkit for AWS (init-aws-toolkit.sh). Region drives both the MCP
      # endpoint host and the `aws agent-toolkit` skill-catalog calls. All three
      # take effect on the next container START (the MCP entry is re-registered
      # every boot), and all three are meant to be set per-host in .env.
      AWS_MCP_REGION: ${AWS_MCP_REGION:-us-east-1}
      # Space-separated AWS profile names. The FIRST is the server's default; the
      # rest become selectable per tool call via the proxy's `aws_profile`
      # parameter. Empty (the shipped default) omits --profile entirely, leaving
      # the standard credential chain / AWS_PROFILE in charge. Profile names are
      # host-specific, so set your own list in .env — see .env.example.
      AWS_MCP_PROFILES: ${AWS_MCP_PROFILES:-}
      # 1 = pass --read-only (server can describe but not mutate). Default 0:
      # the MCP tools can CREATE, MODIFY and DELETE real AWS resources with the
      # permissions of the selected profile. With a multi-profile list above,
      # that includes every account in the list — order it so the least
      # privileged account is first, since that one is the unqualified default.
      AWS_MCP_READ_ONLY: ${AWS_MCP_READ_ONLY:-0}
    volumes:
      - workspace:/workspace                                   # isolated code (no host path)
      - config:/home/claude/.claude                            # Claude state/auth/gh/git/CLAUDE.md
      - command-history:/commandhistory                        # persistent shell history
      - pnpm-store:/home/claude/.local/share/pnpm              # pnpm content-addressable store
      # Host-editable extra firewall allowlist (config only, read-only).
      - ./config/extra-allowlist.txt:/etc/claude-firewall/extra-allowlist.txt:ro
    # Publish the IBKR Client Portal Gateway UI (clientportal.gw binds :5000 in the
    # container) to the HOST LOOPBACK ONLY — never 0.0.0.0. A brokerage auth gateway
    # must not be reachable from other machines on the LAN (same posture as the db
    # sidecar below). Port changes need a container RECREATE (`up -d` / `make
    # rebuild`), not a restart.
    # HOST port is 5001, NOT 5000: macOS reserves :5000 (and :7000) for the AirPlay
    # Receiver (Control Center), which binds *:5000 incl. IPv6 ::1. Since `localhost`
    # resolves to ::1 first on macOS, a host 5000 publish (IPv4 127.0.0.1 only) gets
    # shadowed by AirPlay and the browser never reaches the gateway. Mapping to host
    # 5001 dodges the collision → browse https://localhost:5001. (Container side stays
    # 5000 to match the gateway's listenPort.)
    # NOTE: the egress firewall does NOT block this inbound path — the host connection
    # arrives sourced from the Docker bridge gateway (172.x.0.1), which is inside
    # CONTAINER_CIDR, so init-firewall.sh's INPUT allow accepts it in every mode. The
    # gateway's own root/conf.yaml `ips.allow` must still include 172.* or it rejects
    # the login at the app layer.
    ports:
      - "127.0.0.1:5001:5000"
    # Keep the box alive; the ENTRYPOINT runs firewall -> seed -> update, then execs this.
    command: ["sleep", "infinity"]
    # Assert the boot invariants so a half-booted container (firewall/seed/cron
    # failed) reports `unhealthy` instead of silently `up`. The OUTPUT DROP check
    # is gated on the effective firewall mode recorded by init-firewall.sh: it is
    # only expected in strict mode (permissive/dev open egress on purpose; a
    # degraded WSL2 kernel has no iptables at all), so non-strict modes skip it.
    # The check runs as the `claude` user; reading iptables needs CAP_NET_ADMIN,
    # so it goes through passwordless `sudo -n` (same grant the entrypoint uses).
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          command -v claude >/dev/null &&
          [ -f "$${HOME}/.claude/ENVIRONMENT.md" ] &&
          pgrep -x cron >/dev/null &&
          { [ "$$(cat /etc/claude-firewall/mode 2>/dev/null)" != "strict" ] ||
          sudo -n iptables -S OUTPUT 2>/dev/null | grep -q 'P OUTPUT DROP'; }
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Optional guardrails so a runaway build can't starve the host (tune to taste).
    # mem_limit: 8g
    # cpus: 4

  # Shared Postgres + pgvector sidecar. Opt-in: only starts with the `db` profile
  # (`make db-up`). One server, many databases — run `createdb <project>` per
  # project instead of spinning a new container each time. Reachable from
  # claude-code as `db:5432` (Docker DNS) and from the host at 127.0.0.1:5432.
  db:
    image: pgvector/pgvector:pg18
    container_name: claude-db
    profiles: [db]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # PGDATA must be a SUBDIR of the mounted volume, not the mount root. On a
      # named volume the mount root is 0755 root:root; the entrypoint's
      # `chmod 0700 || :` can fail silently there, so postgres starts against a
      # 0755 dir and FATALs ("data directory has invalid permissions"). With a
      # subdir, initdb creates it fresh as 0700/postgres. (Official image rec.)
      PGDATA: /var/lib/postgresql/data/pgdata
      # The shared .env also injects libpq client vars (PGHOST=db, ...) into this
      # server container; force the healthcheck to the local socket so it doesn't
      # try to reach "db" over TCP before DNS/listener are up.
      PGHOST: ""
    ports:
      - "127.0.0.1:5432:5432"        # localhost only — host GUI tools, never public
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONLY on fresh cluster init (empty data dir): enables pgvector in the
      # default DB + template1 so every database (incl. bare `createdb`) inherits
      # it. No-op on an already-initialized volume — re-key/re-run via db-reset.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-claude} -d $${POSTGRES_DB:-claude}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # pgAdmin 4 web UI for the db sidecar. Same `db` profile, so the profile-aware
  # teardown targets (stop/down/nuke) cover it, but it only starts on request
  # (`make pgadmin-up`; `make db-up` starts the db alone). Joins the project's
  # default network like every service here, so it reaches the server as `db:5432`.
  pgadmin:
    # Tag + multi-arch index digest: the tag documents the version, the digest
    # pins it (upstream re-pushes tags). Bump both together.
    # yamllint disable-line rule:line-length
    image: dpage/pgadmin4:9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    container_name: claude-pgadmin
    profiles: [db]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Login secret ONLY — deliberately NOT the shared .env, which would inject
    # the AWS knobs and the libpq client vars into a web app that needs neither.
    # The db password reaches pgAdmin solely through the pgpass config below.
    env_file:
      - path: pgadmin.env
        required: false
    environment:
      # Pre-register the db sidecar (servers.json) and auto-authenticate it
      # (pgpass). The entrypoint imports both ONLY on first init of the
      # claude-pgadmin volume, the same rule as the db password. After rotating
      # the db password, `make pgadmin-reset` re-imports them.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGPASS_FILE: /pgadmin4/pgpass
      # No egress the UI doesn't need: skip the pgadmin.org version check and
      # the bundled postfix (password-reset mail; it also needs sudo, which
      # no-new-privileges below blocks anyway).
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_DISABLE_POSTFIX: "1"
      # 8080, not the image's default 80: with every capability dropped the
      # entrypoint cannot bind a privileged port (it would fall back to 8080 on
      # its own; pinning it keeps the port mapping below explicit).
      PGADMIN_LISTEN_PORT: "8080"
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
      - source: pgadmin-pgpass
        target: /pgadmin4/pgpass
        uid: "5050"                  # the image's pgadmin user; default is 0444 root
        mode: 0400
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5050:8080"        # localhost only — same posture as the db
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

# Inline (not files on disk) so they interpolate the db credentials from .env
# at create time; nothing new to generate or gitignore. `:-` defaults keep
# `docker compose config` quiet before `make env` has run.
configs:
  pgadmin-servers:
    content: |
      {"Servers": {"1": {
        "Name": "claude-db",
        "Group": "Servers",
        "Host": "db",
        "Port": 5432,
        "MaintenanceDB": "${POSTGRES_DB:-claude}",
        "Username": "${POSTGRES_USER:-claude}",
        "ConnectionParameters": {"sslmode": "prefer", "connect_timeout": 10, "passfile": "/.pgpass"}
      }}}
  # The entrypoint copies PGPASS_FILE to <storage dir>/.pgpass, which is where
  # the servers.json "passfile": "/.pgpass" resolves in server mode.
  pgadmin-pgpass:
    content: |
      db:5432:*:${POSTGRES_USER:-claude}:${POSTGRES_PASSWORD:-}

volumes:
  workspace:
    name: claude-workspace
  config:
    name: claude-config
  command-history:
    name: claude-bashhistory
  pnpm-store:
    name: claude-pnpm-store
  pgdata:
    name: claude-pgdata
  pgadmin-data:
    name: claude-pgadmin
